name: Bug report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please provide as much detail as possible.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Open the app
        2. Click ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen instead.
  - type: input
    id: version
    attributes:
      label: UsbipdTool version
      description: e.g. 1.0.0, or the commit hash
  - type: input
    id: usbipd-version
    attributes:
      label: usbipd version
      description: Output of `usbipd --version`
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Windows version, WSL distro, device VID:PID, etc.
      placeholder: Windows 11 25H2, Ubuntu-22.04, CH343 (1a86:55d3)
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste the log panel output, or attach screenshots if applicable.
